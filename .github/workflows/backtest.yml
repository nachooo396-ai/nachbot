name: Simulación

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Sesiones de bolsa a simular (intradía)"
        default: "250"
      modo:
        description: "intradia o semanas"
        default: "intradia"

concurrency:
  group: backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          if [ "${{ inputs.modo }}" = "semanas" ]; then python swing.py | tee bt.txt; cp SWING.md BACKTEST.md
          else python backtest.py ${{ inputs.dias }} | tee bt.txt; fi
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          BUDGET: "1150"
      - name: Guardar resultado en la rama "estado"
        if: always()
        run: |
          git config user.name "NachBot"; git config user.email "nachbot@users.noreply.github.com"
          F=BACKTEST.md; [ "${{ inputs.modo }}" = "semanas" ] && F=SEMANAS.md
          [ -f BACKTEST.md ] || { echo '```'; cat bt.txt; echo '```'; } > BACKTEST.md
          cp BACKTEST.md /tmp/out.md; rm -f BACKTEST.md SWING.md bt.txt
          git fetch -q origin estado && git checkout -q estado
          cp /tmp/out.md $F
          git add $F && git commit -qm "Simulación ($F)" && git push -q origin estado
