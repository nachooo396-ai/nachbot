name: NachBot

on:
  schedule:
    # Cada 10 min, lunes a viernes, en horario de bolsa de EE. UU. (en UTC, cubre horario de verano e invierno)
    - cron: "3-59/10 13-20 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]      # también se ejecuta al actualizar el código

concurrency:
  group: nachbot
  cancel-in-progress: false

permissions:
  contents: write         # para guardar el estado en la rama "estado"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar bot
        shell: bash
        run: |
          set -o pipefail
          python bot.py 2>&1 | tee salida.txt
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          LIVE: "false"            # cambiar a "true" SOLO cuando se decida pasar a dinero real
          BUDGET: "1150"           # ≈ 1.000 € (el bot opera en dólares)
          START_EQUITY: "100000"   # saldo inicial de la cuenta de práctica

      - name: Guardar estado (rama "estado")
        if: always()
        shell: bash
        run: |
          [ -f salida.txt ] || echo "ERROR: el bot no llegó a ejecutarse" > salida.txt
          FECHA=$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')
          git config user.name "NachBot"; git config user.email "nachbot@users.noreply.github.com"
          if git fetch -q origin estado:estado 2>/dev/null; then git checkout -q estado; else git checkout -q --orphan estado; git rm -rq --cached . ; fi
          { echo "# Estado de NachBot"; echo; echo "Última ejecución: $FECHA (hora de España)"; echo;
            sed 's/^/- /' salida.txt; } > ESTADO.md
          { echo "## $FECHA"; sed 's/^/- /' salida.txt; echo; [ -f REGISTRO.md ] && head -n 2000 REGISTRO.md; } > r.tmp
          mv r.tmp REGISTRO.md
          git add ESTADO.md REGISTRO.md
          git commit -qm "Estado $FECHA" && git push -q origin estado
